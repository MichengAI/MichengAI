<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="280" viewBox="0 0 1200 280"
     role="img" aria-labelledby="title desc">
  <title id="title">迷城 MichengAI</title>
  <desc id="desc">迷城AI个人主页首屏，把复杂的AI做成能直接使用的工具与教程。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101E"/>
      <stop offset="0.58" stop-color="#0A1A2F"/>
      <stop offset="1" stop-color="#061522"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1FB6FF"/>
      <stop offset="1" stop-color="#2EE6C9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#59C7EC" opacity=".15"/>
    </pattern>
  </defs>

  <!-- Full-bleed background prevents light seams on GitHub dark mode. -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>
  <ellipse cx="988" cy="138" rx="290" ry="215" fill="url(#glow)"/>

  <g fill="none" stroke="#1FB6FF" stroke-width="2" opacity=".24">
    <path d="M682 54h118v38h88V66h205v43h84"/>
    <path d="M645 224h142v-44h104v29h126v-56h160"/>
    <path d="M734 130h96v30h99v-49h151"/>
  </g>
  <g fill="#F4C35A">
    <rect x="796" y="88" width="8" height="8" rx="2"/>
    <rect x="1013" y="205" width="8" height="8" rx="2"/>
  </g>
  <g fill="#2EE6C9">
    <circle cx="682" cy="54" r="5"/>
    <circle cx="1177" cy="109" r="5"/>
    <circle cx="645" cy="224" r="5"/>
  </g>

  <g transform="translate(58 34)">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="15" font-weight="700" letter-spacing="1.7">
      <rect width="292" height="30" rx="15" fill="#0E2B43" stroke="#245A78"/>
      <text x="16" y="21" fill="#7FE7FF">AI BUILDER · OPEN SOURCE · CREATOR</text>
    </g>

    <text x="0" y="93"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="58" font-weight="800" fill="#F5FAFF">迷城</text>
    <text x="165" y="89"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="36" font-weight="750" letter-spacing="1" fill="url(#cyan)">MichengAI</text>

    <rect x="0" y="111" width="56" height="4" rx="2" fill="#F4C35A"/>
    <text x="0" y="150"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="27" font-weight="650" fill="#EAF5FF">把复杂的 AI，做成能直接使用的工具与教程</text>
    <text x="0" y="181"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="18" fill="#91ABC0">Building practical AI tools · Sharing workflows that actually work</text>

    <g transform="translate(0 200)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="15" font-weight="650">
      <rect width="126" height="34" rx="10" fill="#0E263A" stroke="#28516D"/>
      <circle cx="20" cy="17" r="4" fill="#2EE6C9"/>
      <text x="34" y="22" fill="#CFE8F6">AI TOOLS</text>

      <g transform="translate(136 0)">
        <rect width="154" height="34" rx="10" fill="#0E263A" stroke="#28516D"/>
        <circle cx="20" cy="17" r="4" fill="#1FB6FF"/>
        <text x="34" y="22" fill="#CFE8F6">OPEN SOURCE</text>
      </g>

      <g transform="translate(300 0)">
        <rect width="168" height="34" rx="10" fill="#0E263A" stroke="#28516D"/>
        <circle cx="20" cy="17" r="4" fill="#F4C35A"/>
        <text x="34" y="22" fill="#CFE8F6">AI TUTORIALS</text>
      </g>
    </g>
  </g>

  <image x="928" y="6" width="174" height="261"
         href="hero-subject.png" xlink:href="hero-subject.png"
         preserveAspectRatio="xMidYMid meet"/>

  <g transform="translate(800 202)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="145" height="52" rx="12" fill="#081522" fill-opacity=".94" stroke="#2B5873"/>
    <text x="16" y="21" font-size="13" font-weight="700" fill="#6DDCFA">CURRENT MODE</text>
    <text x="16" y="41" font-size="17" font-weight="700" fill="#F3F8FC">BUILD → SHARE</text>
  </g>

  <rect x="1" y="1" width="1198" height="278" rx="18" fill="none" stroke="#23435A" stroke-width="2"/>
</svg>
