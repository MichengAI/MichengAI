<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">迷城 MichengAI</title>
  <desc id="desc">迷城AI个人主页首屏，把复杂的AI做成能直接使用的工具与教程。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101E"/>
      <stop offset="0.55" stop-color="#0A1A2F"/>
      <stop offset="1" stop-color="#061522"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1FB6FF"/>
      <stop offset="1" stop-color="#2EE6C9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#59C7EC" opacity=".17"/>
    </pattern>
    <clipPath id="panelClip">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <ellipse cx="966" cy="208" rx="330" ry="290" fill="url(#glow)"/>

    <!-- MichengAI's maze-and-node motif -->
    <g fill="none" stroke="#1FB6FF" stroke-width="2" opacity=".26">
      <path d="M675 78h116v46h86v-31h153v55h112"/>
      <path d="M644 330h128v-50h94v35h129v-72h148"/>
      <path d="M732 191h94v35h96v-62h117"/>
    </g>
    <g fill="#F4C35A">
      <rect x="787" y="119" width="8" height="8" rx="2"/>
      <rect x="990" y="239" width="8" height="8" rx="2"/>
    </g>
    <g fill="#2EE6C9">
      <circle cx="675" cy="78" r="5"/>
      <circle cx="1142" cy="148" r="5"/>
      <circle cx="644" cy="330" r="5"/>
    </g>

    <!-- Editorial title block -->
    <g transform="translate(66 58)">
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
         font-size="18" font-weight="700" letter-spacing="2">
        <rect width="314" height="34" rx="17" fill="#0E2B43" stroke="#245A78"/>
        <text x="18" y="23" fill="#7FE7FF">AI BUILDER · OPEN SOURCE · CREATOR</text>
      </g>

      <text x="0" y="110"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="68" font-weight="800" fill="#F5FAFF">迷城</text>
      <text x="0" y="163"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="41" font-weight="700" letter-spacing="1" fill="url(#cyan)">MichengAI</text>

      <rect x="0" y="188" width="66" height="5" rx="2.5" fill="#F4C35A"/>
      <text x="0" y="235"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="29" font-weight="650" fill="#EAF5FF">把复杂的 AI，做成能直接使用的工具与教程</text>
      <text x="0" y="275"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="20" fill="#91ABC0">Building practical AI tools · Sharing workflows that actually work</text>

      <g transform="translate(0 307)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
         font-size="18" font-weight="650">
        <rect width="142" height="42" rx="12" fill="#0E263A" stroke="#28516D"/>
        <circle cx="22" cy="21" r="5" fill="#2EE6C9"/>
        <text x="38" y="27" fill="#CFE8F6">AI TOOLS</text>

        <g transform="translate(154 0)">
          <rect width="175" height="42" rx="12" fill="#0E263A" stroke="#28516D"/>
          <circle cx="22" cy="21" r="5" fill="#1FB6FF"/>
          <text x="38" y="27" fill="#CFE8F6">OPEN SOURCE</text>
        </g>

        <g transform="translate(341 0)">
          <rect width="191" height="42" rx="12" fill="#0E263A" stroke="#28516D"/>
          <circle cx="22" cy="21" r="5" fill="#F4C35A"/>
          <text x="38" y="27" fill="#CFE8F6">AI TUTORIALS</text>
        </g>
      </g>
    </g>

    <!-- Existing MichengAI pixel mascot, extracted as a transparent raster layer -->
    <image x="863" y="14" width="265" height="397"
           href="hero-subject.png" xlink:href="hero-subject.png"
           preserveAspectRatio="xMidYMid meet"/>

    <g transform="translate(811 310)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect width="150" height="58" rx="14" fill="#081522" fill-opacity=".92" stroke="#2B5873"/>
      <text x="18" y="24" font-size="15" font-weight="700" fill="#6DDCFA">CURRENT MODE</text>
      <text x="18" y="45" font-size="18" font-weight="700" fill="#F3F8FC">BUILD → SHARE</text>
    </g>

    <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#23435A" stroke-width="2"/>
  </g>
</svg>
